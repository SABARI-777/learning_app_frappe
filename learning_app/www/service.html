<!-- learning_app/www/articles.html -->
{% extends "templates/web.html" %}
    {% block page_content %}
    <h1>{{ title }}</h1>
        <ul>
            {% for article in sr %}
                <li><a href="/service/{{ article.name | urlencode }}">{{ article.name }}</a>
                </li>
                {% else %}
                <li>No published articles.</li>
            {% endfor %}
        </ul>
    {% endblock %}
